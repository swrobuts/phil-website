site_name: Phil – Knowledge Navigator
site_url: https://swrobuts.github.io/phil-website/
site_description: A student reimagining of Apple's 1987 Knowledge Navigator
site_author: Robert Butscher
repo_url: https://github.com/swrobuts/phil-knowledge-navigator
repo_name: swrobuts/phil-knowledge-navigator

docs_dir: docs
site_dir: site

theme:
  name: material
  language: en
  palette:
    scheme: slate
    primary: amber
    accent: amber
  font:
    text: DM Sans
    code: DM Mono
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.highlight
    - content.code.copy

nav:
  - Home: index.md
  - The Story:
      - Intellectual Lineage: story.md
      - Use Cases 1987 vs 2026: use-cases.md
  - Features:
      - Overview: features/index.md
      - Mail Triage: features/mail-triage.md
      - Dashboard: features/dashboard.md
      - Calendar: features/calendar.md
      - Meeting Preparation: features/meeting-prep.md
      - Memory & Learning: features/memory-learning.md
      - Semantic Search: features/rag-search.md
  - Getting Started: setup.md
  - Architecture: architecture.md
  - Tech Stack: tech-stack.md
  - Prompts (CO-STAR): prompts.md
  - Contributing: contributing.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.tabbed:
      alternate_style: true
  - attr_list
  - md_in_html
  - tables

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/swrobuts/phil-knowledge-navigator

copyright: >
  Phil is a student project at THWS. Not affiliated with Apple Inc.
  Built with Claude Code by Anthropic. MIT Licence.
